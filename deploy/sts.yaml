# 生产 webapp / 8890。预发只改 namespace=webapp-pre，port 与 containerPort 仍是 8890。
# 镜像、USER_GRPC_ADDR、Secret 和 PVC 按集群填写。口令只放在 Secret 里，不写进 env。
# Q44：多个副本共写同一个 dataDir，PVC 需要 ReadWriteMany。
apiVersion: v1
kind: Service
metadata:
  name: worb
  namespace: webapp
spec:
  clusterIP: None
  selector:
    app: worb
  ports:
    - name: http
      port: 8890
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: worb
  namespace: webapp
spec:
  serviceName: worb
  replicas: 1
  selector:
    matchLabels:
      app: worb
  template:
    metadata:
      labels:
        app: worb
    spec:
      containers:
        - name: worb
          image: worb:latest
          ports:
            - name: http
              containerPort: 8890
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 18
          env:
            - name: host
              value: "0.0.0.0"
            - name: port
              value: "8890"
            - name: dataDir
              value: "/data"
            - name: dbEngine
              value: "mysql"
            - name: OBJECT_STORE
              value: "oss"
            - name: USER_GRPC_ADDR
              value: "host:port"
            - name: USER_GRPC_CERT_ENABLED
              value: "true"
            - name: USER_GRPC_CERT_PATH
              value: "/etc/secrets/user_grpc_cert.pem"
            - name: JOB_REAP_UPLOADING
              value: "off"
            - name: JOB_FAIL_DIGEST
              value: "off"
            - name: JOB_RETRY_DELETE
              value: "off"
            - name: JOB_UPLOAD_SCAN
              value: "off"
            - name: JOB_UNLINK_LOCAL
              value: "off"
          volumeMounts:
            - name: worb-data
              mountPath: /data
            - name: worb-secrets
              mountPath: /etc/secrets
              readOnly: true
      volumes:
        - name: worb-data
          persistentVolumeClaim:
            claimName: worb-data
        - name: worb-secrets
          secret:
            secretName: worb-secrets
# Secret worb-secrets 的键要变成这些文件名：
# db_host db_port db_user db_passwd db_name
# object_store_endpoint object_store_endpoint_pub object_store_bucket object_store_access_key object_store_secret_key
# object_store_region 与 object_store_session_token 可省略
# user_grpc_cert.pem 是校验远程 gRPC 的 CA，不是客户端证书
# PVC worb-data 挂到 /data，多副本时使用 ReadWriteMany
